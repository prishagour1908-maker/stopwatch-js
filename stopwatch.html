    <button id="start">START</button>

      window.onload = function () {

        let seconds = 0;
        let milliseconds = 0;
        let timer;

        const sec = document.getElementById("s");
        const ms = document.getElementById("ms");

            clearInterval(timer);
            timer = setInterval(startTimer, 10);
        };

            clearInterval(timer);
        };

        document.getElementById("restart").onclick = function () {
            clearInterval(timer);
            seconds = 0;
